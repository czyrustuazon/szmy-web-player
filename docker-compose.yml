services:
  masterplayer:
    build: .
    image: masterplayer:latest
    container_name: masterplayer
    restart: unless-stopped
    ports:
      # IPv4 only, on purpose: Docker's IPv6 port forwarding hides the real client address, which
      # the access check (MP_ALLOWED_NETS) needs. Set BIND_ADDR to this host's Tailscale address
      # (`tailscale ip -4`) to listen on the tailnet only, like anime-db-stream does.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8787}:8080"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Blank = open access (no login). Set a value to require sign-in.
      MP_ADMIN_PASSWORD: "${MP_ADMIN_PASSWORD:-}"
      # Who may connect (see .env.example): your Tailscale network and home network by default.
      MP_ALLOWED_NETS: "${MP_ALLOWED_NETS:-tailscale,lan}"
      MP_KNOWN_DEVICES: "${MP_KNOWN_DEVICES:-}"
      # Tunnels / reverse proxies whose forwarding headers are believed, and where their visitors may come from.
      MP_TRUSTED_PROXIES: "${MP_TRUSTED_PROXIES:-loopback,lan}"
      MP_TUNNEL_NETS: "${MP_TUNNEL_NETS:-any}"
      # Sign in with Google, for a public tunnel (see .env.example). Off while the client id is blank.
      MP_GOOGLE_CLIENT_ID: "${MP_GOOGLE_CLIENT_ID:-}"
      MP_GOOGLE_CLIENT_SECRET: "${MP_GOOGLE_CLIENT_SECRET:-}"
      MP_ALLOWED_EMAILS: "${MP_ALLOWED_EMAILS:-}"
      MP_PUBLIC_URL: "${MP_PUBLIC_URL:-}"
      MP_READ_ONLY: "${MP_READ_ONLY:-false}"
      MP_UPLOAD_SUBDIR: "${MP_UPLOAD_SUBDIR:-uploads}"
      MP_COOKIE_SECURE: "${MP_COOKIE_SECURE:-false}"
      MP_MAX_UPLOAD_MB: "${MP_MAX_UPLOAD_MB:-61440}"
      MP_MIN_FREE_MB: "${MP_MIN_FREE_MB:-1024}"
      MP_UPLOAD_TTL_HOURS: "${MP_UPLOAD_TTL_HOURS:-48}"
    volumes:
      # Append ":ro" to the music mount for a read-only library (delete and upload are then disabled).
      - ${LIBRARY_HOST_PATH:-./music}:/music
      # Where uploads are stored on the host (default: ./uploads, on the same disk as this project).
      # It is mounted inside the library, so uploaded music shows up there like everything else.
      - ${UPLOADS_HOST_PATH:-./uploads}:/music/${MP_UPLOAD_SUBDIR:-uploads}
      - ${DATA_HOST_PATH:-./data}:/data
